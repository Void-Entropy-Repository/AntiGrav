name: VER AntiGravity Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day.
    - cron: '0 0 * * *'
  # Allows me to run it manually, I need to test duh.
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the commit back to the repo
      actions: write  # Needed to trigger the build workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Scraper Script
        run: |
          chmod +x scripts/update.sh
          # Run the script targeting the local template file
          ./scripts/update.sh

      - name: Check if template was modified
        id: check
        run: |
          if git diff --exit-code template-app template-ide; then
            echo "No changes detected. Workflow stopping."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Update detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add template-app template-ide

          NEW_VER=$(grep '^version=' template-app | cut -d= -f2 | tr -d '"'\')

          git commit -m "chore(antigravity): auto-update to $NEW_VER"

          git push

      - name: Trigger Build Pipeline
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-xbps.yml --ref main
          echo "Build workflow triggered successfully."
