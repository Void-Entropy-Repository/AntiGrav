name: Build AntiGravity XBPS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'template*' # Triggers on any template file change
      - '.github/workflows/build-xbps.yml'
  workflow_dispatch:

# Prevents race conditions if multiple commits are pushed quickly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install static XBPS tools (Ubuntu to Void Bridge)
        run: |
          wget https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          sudo tar xf xbps-static-latest.x86_64-musl.tar.xz -C /
          xbps-query -V

      - name: Patch Ubuntu DNS for musl resolver
        run: |
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf

      - name: Disable AppArmor User Namespace Restriction (Ubuntu 24.04 fix)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Clone void-packages
        run: git clone https://github.com/void-linux/void-packages.git --depth 1

      - name: Prepare void-packages environment
        run: |
          cd void-packages
          ./xbps-src binary-bootstrap
          echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf

      - name: Inject templates dynamically
        run: |
          for t in template*; do
            PKG_NAME=$(echo $t | sed 's/template/antigravity/')
            mkdir -p void-packages/srcpkgs/$PKG_NAME
            cp $t void-packages/srcpkgs/$PKG_NAME/template
          done

      - name: Build packages
        run: |
          cd void-packages
          # Build all antigravity-* packages found in srcpkgs
          for p in srcpkgs/antigravity srcpkgs/antigravity-*; do
            [ -d "$p" ] && ./xbps-src pkg $(basename $p)
          done

      - name: Generate Release Snapshot ID
        run: |
          # Create a CalVer timestamped tag with the commit hash
          SNAPSHOT="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "SNAPSHOT=${SNAPSHOT}" >> $GITHUB_ENV

      - name: Publish Semantic Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SNAPSHOT }}
          name: 'AntiGravity Build ${{ env.SNAPSHOT }}'
          make_latest: true
          files: void-packages/hostdir/binpkgs/nonfree/**/*.xbps

      - name: Update Floating 'latest' Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Move the literal 'latest' git tag to the current commit and force push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
